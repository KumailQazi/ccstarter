[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccstarter"
version = "0.1.0"
description = "Read Common Crawl without downloading Common Crawl: a teaching starter kit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
fast = ["fastwarc>=0.15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
